<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joao Kido profile header</title>
  <desc id="desc">Dark technical profile header with subtle systems grid and product interface details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071013"/>
      <stop offset="0.48" stop-color="#0A1218"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="92" x2="1004" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="0.44" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#D1FAE5" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>

  <path d="M126 292 C252 126 384 354 520 196 C657 38 786 190 935 116 C1015 76 1086 74 1142 94" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="2.4"/>
  <path d="M92 324 C232 206 340 304 454 248 C578 187 621 70 770 147 C893 211 950 278 1108 202" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5"/>

  <g filter="url(#soft)" opacity="0.45">
    <circle cx="960" cy="112" r="86" fill="#38BDF8"/>
    <circle cx="236" cy="294" r="92" fill="#34D399"/>
  </g>

  <g transform="translate(742 128)" opacity="0.92">
    <rect x="0" y="0" width="318" height="184" rx="16" fill="#0B1117" stroke="#A7F3D0" stroke-opacity="0.16"/>
    <rect x="18" y="20" width="118" height="10" rx="5" fill="#6EE7B7" fill-opacity="0.82"/>
    <rect x="18" y="50" width="276" height="1" fill="#E5E7EB" fill-opacity="0.08"/>
    <circle cx="42" cy="86" r="16" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.72"/>
    <circle cx="42" cy="138" r="16" fill="#A78BFA" fill-opacity="0.18" stroke="#A78BFA" stroke-opacity="0.7"/>
    <rect x="75" y="75" width="168" height="8" rx="4" fill="#E5E7EB" fill-opacity="0.68"/>
    <rect x="75" y="93" width="106" height="7" rx="3.5" fill="#E5E7EB" fill-opacity="0.26"/>
    <rect x="75" y="127" width="194" height="8" rx="4" fill="#E5E7EB" fill-opacity="0.6"/>
    <rect x="75" y="145" width="132" height="7" rx="3.5" fill="#E5E7EB" fill-opacity="0.24"/>
  </g>

  <g transform="translate(110 98)">
    <text x="0" y="0" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700" letter-spacing="0">Joao Kido</text>
    <text x="0" y="52" fill="#CFFAFE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0">AI systems • product tools • simulations • research</text>
    <text x="0" y="108" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" letter-spacing="0">Building interfaces that make complex systems easier to understand.</text>
  </g>

  <g transform="translate(110 254)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="128" height="34" rx="17" fill="#6EE7B7" fill-opacity="0.1" stroke="#6EE7B7" stroke-opacity="0.28"/>
